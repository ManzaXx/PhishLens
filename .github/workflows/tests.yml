name: PhishLens · tests

on:
  # En las ramas basta con el run del PR: así cada cambio se prueba una vez y llega un solo aviso.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test

  e2e:
    # Navegador real: privacidad (ni una petición fuera del origen) y accesibilidad (axe + teclado).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      # Sin --with-deps: la imagen de GitHub ya trae las librerías de Chromium, y el apt-get de las fuentes
      # fallaba al no resolver los espejos de Ubuntu (Temporary failure resolving security.ubuntu.com).
      - run: npx --no-install playwright install chromium
      - run: npm run test:e2e

  worker-csp:
    # El worker de análisis hereda la CSP del documento (ADR 0007). Chromium ya lo prueba el job e2e; aquí se repite
    # en Firefox y WebKit, que en local no siempre se pueden instalar. Si un motor dejara pasar algo, este job falla.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps firefox webkit
      - run: E2E_BROWSERS=firefox,webkit node --test tests/e2e/worker.e2e.js
